# Hyprland config
# Wiki: https://wiki.hypr.land/Configuring/
# Палитра генерируется matugen: ~/.config/hypr/scripts/theme.sh

source = ~/.config/hypr/colors.conf


################
### MONITORS ###
################

monitor = ,2880x1920@60,auto,auto


###################
### MY PROGRAMS ###
###################

$terminal = kitty
$fileManager = dolphin
$menu = hyprlauncher


#################
### AUTOSTART ###
#################

exec-once = hyprpaper
exec-once = hypridle
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = hyprctl setcursor Bibata-Modern-Classic 24
exec-once = command -v hyprsunset >/dev/null && hyprsunset


#############################
### ENVIRONMENT VARIABLES ###
#############################

env = XCURSOR_THEME,Bibata-Modern-Classic
env = XCURSOR_SIZE,24
env = HYPRCURSOR_THEME,Bibata-Modern-Classic
env = HYPRCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = GDK_BACKEND,wayland,x11,*
env = ELECTRON_OZONE_PLATFORM_HINT,auto


#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in = 4
    gaps_out = 10
    border_size = 2

    col.active_border = $primary $tertiary 45deg
    col.inactive_border = $outline_variant

    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 12
    rounding_power = 2.5

    active_opacity = 1.0
    inactive_opacity = 0.92
    dim_inactive = true
    dim_strength = 0.08

    shadow {
        enabled = true
        range = 20
        render_power = 3
        offset = 0 4
        color = rgba(00000066)
        color_inactive = rgba(00000033)
    }

    blur {
        enabled = true
        size = 6
        passes = 3
        noise = 0.02
        contrast = 1.0
        brightness = 0.9
        vibrancy = 0.2
        popups = true
    }
}

animations {
    enabled = yes

    #        NAME,           X0,   Y0,   X1,   Y1
    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1

    animation = global,           1, 10,   default
    animation = border,           1, 5.39, easeOutQuint
    animation = borderangle,      1, 50,   linear, loop
    animation = windows,          1, 4.79, easeOutQuint
    animation = windowsIn,        1, 4.1,  easeOutQuint, popin 87%
    animation = windowsOut,       1, 1.49, linear,       popin 87%
    animation = fadeIn,           1, 1.73, almostLinear
    animation = fadeOut,          1, 1.46, almostLinear
    animation = fade,             1, 3.03, quick
    animation = layers,           1, 3.81, easeOutQuint
    animation = layersIn,         1, 4,    easeOutQuint, fade
    animation = layersOut,        1, 1.5,  linear,       fade
    animation = fadeLayersIn,     1, 1.79, almostLinear
    animation = fadeLayersOut,    1, 1.39, almostLinear
    animation = workspaces,       1, 4,    easeOutQuint, slide
    animation = specialWorkspace, 1, 4,    easeOutQuint, slidevert
    animation = zoomFactor,       1, 7,    quick
}

dwindle {
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    background_color = $surface
    animate_manual_resizes = true
    animate_mouse_windowdragging = true
    focus_on_activate = true
}

cursor {
    inactive_timeout = 5
}


#############
### INPUT ###
#############

input {
    kb_layout = us,ru
    kb_variant =
    kb_model =
    kb_options = grp:alt_shift_toggle
    kb_rules =

    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = false
    }
}

gesture = 3, horizontal, workspace

device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


###################
### KEYBINDINGS ###
###################

$mainMod = SUPER

bind = $mainMod, SPACE, exec, vicinae toggle
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, B, exec, zen-browser
bind = $mainMod, Q, killactive,
bind = $mainMod, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, T, togglefloating,
bind = $mainMod, R, exec, $menu
bind = $mainMod, P, pseudo,
bind = $mainMod, J, layoutmsg, togglesplit
bind = $mainMod, L, exec, hyprlock
bind = $mainMod, F, fullscreen, 0

# Скриншоты (hyprshot)
bind = , Print, exec, hyprshot -m region --clipboard-only
bind = SHIFT, Print, exec, hyprshot -m region -o ~/Pictures/Screenshots
bind = $mainMod, Print, exec, hyprshot -m window -o ~/Pictures/Screenshots

# Фокус
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Рабочие столы
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow


# Пипетка
bind = $mainMod, C, exec, hyprpicker -a -f hex

bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous


##############################
### WINDOWS AND WORKSPACES ###
##############################

windowrule {
    name = suppress-maximize-events
    match:class = .*
    suppress_event = maximize
}

windowrule {
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false
    no_focus = true
}

windowrule {
    name = move-hyprland-run
    match:class = hyprland-run
    move = 20 monitor_h-120
    float = yes
}

# Утилиты и диалоги — плавающие, по центру
windowrule {
    name = float-utils
    match:class = ^(org.pulseaudio.pavucontrol|pavucontrol|nm-connection-editor|blueman-manager|nwg-look|qt6ct|waypaper|org.kde.kdialog)$
    float = yes
    size = 900 600
    center = yes
}

windowrule {
    name = float-dialogs
    match:title = ^(Open File|Open Folder|Save As|Save File|File Upload|Select a File|Choose Files|Открыть файл|Сохранить как).*$
    float = yes
    center = yes
}

windowrule {
    name = pip
    match:title = ^(Picture-in-Picture|Картинка в картинке)$
    float = yes
    pin = yes
    keep_aspect_ratio = yes
    size = 640 360
    move = monitor_w-660 monitor_h-380
}

# Blur под панелями и лаунчером
layerrule {
    name = blur-shell
    match:namespace = ^(waybar|vicinae|swaync-control-center|swaync-notification-window|logout_dialog|hyprlauncher)$
    blur = on
    ignore_alpha = 0.3
}

# Оболочка (панель, уведомления, OSD): переключение — ~/.config/hypr/scripts/shell-switch.sh waybar|caelestia
source = ~/.config/hypr/shell.conf
