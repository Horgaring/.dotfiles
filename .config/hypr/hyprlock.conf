# hyprlock — цвета из matugen
source = ~/.config/hypr/colors.conf

$font = JetBrainsMono Nerd Font

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    animation = fadeIn, 1, 5, easeOutQuint
    animation = fadeOut, 1, 5, easeOutQuint
    animation = inputFieldDots, 1, 2, easeOutQuint
}

background {
    monitor =
    path = ~/Pictures/Wallpapers/wallpaper.jpeg
    blur_passes = 3
    blur_size = 7
    brightness = 0.6
    contrast = 0.9
    vibrancy = 0.2
}

# Время
label {
    monitor =
    text = $TIME
    color = $on_surface
    font_size = 110
    font_family = $font ExtraBold
    shadow_passes = 2
    shadow_size = 4
    position = 0, 220
    halign = center
    valign = center
}

# Дата
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = $primary
    font_size = 20
    font_family = $font
    shadow_passes = 2
    position = 0, 110
    halign = center
    valign = center
}

# Пользователь
label {
    monitor =
    text =   $USER
    color = $on_surface_variant
    font_size = 14
    font_family = $font
    position = 0, 30
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 56
    outline_thickness = 2
    rounding = 16

    outer_color = $primary $tertiary 45deg
    inner_color = $surface_container_a
    font_color = $on_surface
    check_color = $tertiary
    fail_color = $error
    capslock_color = $primary

    font_family = $font
    placeholder_text = <i>Пароль…</i>
    fail_text = <b>$FAIL ($ATTEMPTS)</b>
    fade_on_empty = false
    dots_size = 0.25
    dots_spacing = 0.35
    dots_center = true
    shadow_passes = 2

    position = 0, -40
    halign = center
    valign = center
}

# Раскладка
label {
    monitor =
    text = $LAYOUT[EN,RU]
    color = $on_surface_variant
    font_size = 12
    font_family = $font
    onclick = hyprctl switchxkblayout all next
    position = 0, -110
    halign = center
    valign = center
}

# Батарея
label {
    monitor =
    text = cmd[update:30000] echo "󰁹 $(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null | head -1)%"
    color = $on_surface_variant
    font_size = 12
    font_family = $font
    position = -30, 30
    halign = right
    valign = bottom
}
