# Оболочка: waybar + swaync + swayosd + wlogout

exec-once = waybar
exec-once = command -v swayosd-server >/dev/null && swayosd-server

# Громкость/яркость: индикатор swayosd, если установлен, иначе без него
bindel = ,XF86AudioRaiseVolume, exec, swayosd-client --output-volume +5 --max-volume 100 || wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, swayosd-client --output-volume -5 || wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, swayosd-client --output-volume mute-toggle || wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, swayosd-client --input-volume mute-toggle || wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, swayosd-client --brightness +5 || brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, swayosd-client --brightness -5 || brightnessctl -e4 -n2 set 5%-
bindr = CAPS, Caps_Lock, exec, swayosd-client --caps-lock

# Меню выключения
bind = $mainMod, Escape, exec, pkill wlogout || wlogout -b 3 -T 180 -B 180 -L 260 -R 260
