# Оболочка: Caelestia (quickshell) — панель, лаунчер, уведомления, OSD, сайдбар, меню сессии
# Горячие клавиши адаптированы из caelestia-dots/caelestia (hypr/hyprland/keybinds.lua)

exec-once = caelestia shell -d

# Лаунчер — короткое нажатие Super (Super+Space остаётся за vicinae)
bindr = SUPER, SUPER_L, global, caelestia:launcher

# Панели
bind = $mainMod, N, global, caelestia:sidebar
bind = $mainMod, K, global, caelestia:showall
bind = CTRL ALT, Delete, global, caelestia:session
bind = $mainMod, Escape, global, caelestia:session
bindl = CTRL ALT, C, global, caelestia:clearNotifs

# Буфер обмена и эмодзи
bind = $mainMod, V, exec, pkill fuzzel || caelestia clipboard
bind = $mainMod ALT, V, exec, pkill fuzzel || caelestia clipboard -d
bind = $mainMod, period, exec, pkill fuzzel || caelestia emoji -p

# Запись экрана
bind = $mainMod ALT, R, exec, caelestia record -r
bind = CTRL ALT, R, exec, caelestia record -s

# Громкость (OSD рисует сама оболочка) и яркость
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ 0; wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ 0; wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, global, caelestia:brightnessUp
bindel = ,XF86MonBrightnessDown, global, caelestia:brightnessDown

# Перезапуск оболочки
bindr = CTRL SUPER ALT, R, exec, caelestia shell -k; caelestia shell -d

layerrule {
    name = caelestia-no-anim
    match:namespace = ^caelestia-(border-exclusion|area-picker)$
    no_anim = on
}

layerrule {
    name = caelestia-fade
    match:namespace = ^caelestia-(drawers|background)$
    animation = fade
}
